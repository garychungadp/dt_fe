name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, development, testing, staging, production]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.0, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
